<section class="container block travel" id="offers">
  <div class="travel__slides">
    <article class="travel__slide">
      <div class="slide__img">
        <picture>
          <source srcset="assets/images/travel-1.webp" type="image/webp" />
          <img
            src="assets/images/travel-1.jpg"
            alt="باشگاه مشتریان و کدهای تخفیف تپسی"
            width="640"
            height="451"
            loading="lazy" />
        </picture>
      </div>
      <div class="slide__detail">
        <div class="slide__header">
          <span class="slide__tag">باشگاه مشتریان</span>
        </div>
        <h3 class="slide__title">تبدیل امتیاز سفرهای روزانه به تخفیف خرید</h3>
        <p class="slide__desc">با هر سفر ستاره دریافت کنید و آن‌ها را برای خرید آنلاین از دیجی‌کالا خرج کنید.</p>
      </div>
    </article>

    <article class="travel__slide">
      <div class="slide__img">
        <picture>
          <source srcset="assets/images/travel-2.webp" type="image/webp" />
          <img
            src="assets/images/travel-2.jpg"
            alt="تخفیف ویژه مسیرهای دانشجویی"
            width="640"
            height="427"
            loading="lazy" />
        </picture>
      </div>
      <div class="slide__detail">
        <div class="slide__header">
          <span class="slide__tag">تخفیف دانشگاهی</span>
        </div>
        <h3 class="slide__title">سفرهای به‌صرفه در مسیرهای دانشگاهی</h3>
        <p class="slide__desc">رفت‌وآمد آسان میان دانشگاه و خوابگاه در سراسر شهرهای فعال با تخفیف ثابت.</p>
      </div>
    </article>
  </div>
</section>
